spring:
  application:
    name: kodama-node-agent

server:
  port: ${NODE_AGENT_HTTP_PORT:8181}
  address: ${NODE_AGENT_HTTP_BIND_ADDRESS:0.0.0.0}

instances:
  instance-runtime:
    image: ${NODE_AGENT_INSTANCE_RUNTIME_IMAGE:}
    workspace-mount-path: ${NODE_AGENT_INSTANCE_RUNTIME_WORKSPACE_MOUNT_PATH:/workspace}
    working-dir: ${NODE_AGENT_INSTANCE_RUNTIME_WORKING_DIR:}
    install-script-timeout-seconds: ${NODE_AGENT_INSTANCE_RUNTIME_INSTALL_SCRIPT_TIMEOUT_SECONDS:300}
    stop-timeout-seconds: ${NODE_AGENT_INSTANCE_RUNTIME_STOP_TIMEOUT_SECONDS:}
  instance-callbacks:
    max-attempts: ${NODE_AGENT_INSTANCE_CALLBACKS_MAX_ATTEMPTS:1}
    retry-backoff-millis: ${NODE_AGENT_INSTANCE_CALLBACKS_RETRY_BACKOFF_MILLIS:500}
  instance-monitor:
    enabled: ${NODE_AGENT_INSTANCE_MONITOR_ENABLED:true}
    interval-seconds: ${NODE_AGENT_INSTANCE_MONITOR_INTERVAL_SECONDS:10}

node-agent:
  node-id: ${NODE_AGENT_ID:}
  node-name: ${NODE_AGENT_NAME:}
  region: ${NODE_AGENT_REGION:}
  capacity-slots: ${NODE_AGENT_CAPACITY_SLOTS:}
  dev-mode: ${NODE_AGENT_DEV_MODE:false}
  tags: ${NODE_AGENT_TAGS:}
  base-url: ${NODE_AGENT_BASE_URL:}
  brain-base-url: ${NODE_AGENT_BRAIN_BASE_URL:}
  registration-enabled: ${NODE_AGENT_REGISTRATION_ENABLED:true}
  heartbeat-interval-seconds: ${NODE_AGENT_HEARTBEAT_INTERVAL_SECONDS:0}
  docker-host: ${NODE_AGENT_DOCKER_HOST:}
  docker:
    host: ${NODE_AGENT_DOCKER_HOST:unix:///var/run/docker.sock}
    tls-verify: ${NODE_AGENT_DOCKER_TLS_VERIFY:}
    cert-path: ${NODE_AGENT_DOCKER_CERT_PATH:}
    api-version: ${NODE_AGENT_DOCKER_API_VERSION:}
    config-dir: ${NODE_AGENT_DOCKER_CONFIG_DIR:}
    context: ${NODE_AGENT_DOCKER_CONTEXT:}
    max-connections: ${NODE_AGENT_DOCKER_MAX_CONNECTIONS:}
    connection-timeout-seconds: ${NODE_AGENT_DOCKER_CONNECTION_TIMEOUT_SECONDS:5}
    response-timeout-seconds: ${NODE_AGENT_DOCKER_RESPONSE_TIMEOUT_SECONDS:30}
  workspace-dir: ${NODE_AGENT_WORKSPACE_DIR:./data}
  cache-dir: ${NODE_AGENT_CACHE_DIR:./cache}
  template-cache-check:
    enabled: ${NODE_AGENT_TEMPLATE_CACHE_CHECK_ENABLED:false}
    template-id: ${NODE_AGENT_TEMPLATE_CACHE_CHECK_TEMPLATE_ID:}
    version: ${NODE_AGENT_TEMPLATE_CACHE_CHECK_VERSION:}
    checksum: ${NODE_AGENT_TEMPLATE_CACHE_CHECK_CHECKSUM:}
  template-cache-limits:
    max-extracted-bytes: ${NODE_AGENT_TEMPLATE_CACHE_LIMITS_MAX_EXTRACTED_BYTES:10737418240}
    max-entries: ${NODE_AGENT_TEMPLATE_CACHE_LIMITS_MAX_ENTRIES:100000}
  variable-substitution:
    max-file-bytes: ${NODE_AGENT_VARIABLE_SUBSTITUTION_MAX_FILE_BYTES:1048576}

  auth:
    header-name: ${NODE_AGENT_AUTH_HEADER_NAME:X-Node-Token}
    token-path: ${NODE_AGENT_AUTH_TOKEN_PATH:}
    cert-path: ${NODE_AGENT_AUTH_CERT_PATH:}
  s3:
    endpoint: ${NODE_AGENT_S3_ENDPOINT:}
    region: ${NODE_AGENT_S3_REGION:}
    bucket: ${NODE_AGENT_S3_BUCKET:}
    access-key: ${NODE_AGENT_S3_ACCESS_KEY:}
    secret-key: ${NODE_AGENT_S3_SECRET_KEY:}

plugins:
  dir: ${PLUGINS_DIR:./plugins}
  enabled: ${PLUGINS_ENABLED:}
