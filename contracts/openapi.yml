openapi: 3.0.3
info:
  title: Kodama Brain API
  version: "0.1.0"
  description: |
    REST surface for managing templates and template versions.
    All endpoints are served by the Brain service.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /actuator/health:
    get:
      tags: [Operations]
      summary: Health status
      description: Returns overall service health including component statuses.
      security: []
      responses:
        "200":
          description: Health status for the Brain service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /actuator/metrics:
    get:
      tags: [Operations]
      summary: Metrics index
      description: Returns available metric names.
      security: []
      responses:
        "200":
          description: Metric names exposed by Brain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsNamesResponse"
  /actuator/metrics/{metricName}:
    get:
      tags: [Operations]
      summary: Metric details
      description: Returns measurements for a specific metric.
      security: []
      parameters:
        - name: metricName
          in: path
          required: true
          schema:
            type: string
        - name: tag
          in: query
          required: false
          schema:
            type: string
          description: Tag filter in the format `key:value`. Repeat to apply multiple filters.
      responses:
        "200":
          description: Metric measurements and available tags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricResponse"
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: Exchange credentials for a bearer token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/instances:
    get:
      tags: [Instances]
      summary: List instances
      description: Returns all instances with their template layers.
      responses:
        "200":
          description: Instances ordered by persistence default.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Instance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Instances]
      summary: Create instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInstanceRequest"
      responses:
        "201":
          description: Instance created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/instances/{id}:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    get:
      tags: [Instances]
      summary: Get instance
      responses:
        "200":
          description: Instance found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/instances/{id}/start:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    post:
      tags: [Instances]
      summary: Start instance
      description: Dispatch a prepare or start command depending on the instance state.
      responses:
        "200":
          description: Start command dispatched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/instances/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    post:
      tags: [Instances]
      summary: Stop instance
      description: Dispatch a stop command to the assigned node.
      responses:
        "200":
          description: Stop command dispatched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/instances/{id}/destroy:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    post:
      tags: [Instances]
      summary: Destroy instance
      description: Dispatch a destroy command to the assigned node.
      responses:
        "200":
          description: Destroy command dispatched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/instances/{id}/template-assignments:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    get:
      tags: [Template Assignments]
      summary: List instance template assignments
      responses:
        "200":
          description: Assignments ordered by priority.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemplateAssignment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Template Assignments]
      summary: Add template assignment to instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateAssignmentRequest"
      responses:
        "201":
          description: Assignment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateAssignment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/instances/{id}/template-assignments/{assignmentId}:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
      - $ref: "#/components/parameters/AssignmentId"
    delete:
      tags: [Template Assignments]
      summary: Remove template assignment from instance
      responses:
        "204":
          description: Assignment removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/instances/{id}/groups:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    get:
      tags: [Instance Groups]
      summary: List groups for an instance
      responses:
        "200":
          description: Groups associated with the instance.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InstanceGroup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/instances/{id}/groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
      - $ref: "#/components/parameters/GroupId"
    put:
      tags: [Instance Groups]
      summary: Add instance to group
      responses:
        "204":
          description: Membership added (idempotent).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Instance Groups]
      summary: Remove instance from group
      responses:
        "204":
          description: Membership removed (idempotent).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/instance-groups:
    get:
      tags: [Instance Groups]
      summary: List instance groups
      responses:
        "200":
          description: Groups ordered by persistence default.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InstanceGroup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Instance Groups]
      summary: Create instance group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInstanceGroupRequest"
      responses:
        "201":
          description: Group created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceGroup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/instance-groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [Instance Groups]
      summary: Get instance group
      responses:
        "200":
          description: Group found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceGroup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/instance-groups/{groupId}/template-assignments:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [Template Assignments]
      summary: List group template assignments
      responses:
        "200":
          description: Assignments ordered by priority.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemplateAssignment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Template Assignments]
      summary: Add template assignment to group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateAssignmentRequest"
      responses:
        "201":
          description: Assignment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateAssignment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/instance-groups/{groupId}/template-assignments/{assignmentId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/AssignmentId"
    delete:
      tags: [Template Assignments]
      summary: Remove template assignment from group
      responses:
        "204":
          description: Assignment removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/nodes:
    get:
      tags: [Nodes]
      summary: List nodes
      responses:
        "200":
          description: Nodes ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Node"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/nodes/register:
    post:
      tags: [Nodes]
      summary: Register node
      description: Insert or refresh node metadata.
      security:
        - nodeToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeRegistrationRequest"
      responses:
        "200":
          description: Node registered or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeRegistrationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/nodes/{nodeId}/heartbeat:
    parameters:
      - $ref: "#/components/parameters/NodeId"
    post:
      tags: [Nodes]
      summary: Send heartbeat
      description: Update node status and slot usage.
      security:
        - nodeToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeHeartbeatRequest"
      responses:
        "200":
          description: Heartbeat processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/nodes/{nodeId}/instances/{instanceId}/prepared:
    parameters:
      - $ref: "#/components/parameters/NodeId"
      - $ref: "#/components/parameters/NodeInstanceId"
    post:
      tags: [Nodes]
      summary: Report instance prepared
      description: Callback from node when an instance finishes preparation.
      security:
        - nodeToken: []
      responses:
        "200":
          description: Callback accepted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/nodes/{nodeId}/instances/{instanceId}/running:
    parameters:
      - $ref: "#/components/parameters/NodeId"
      - $ref: "#/components/parameters/NodeInstanceId"
    post:
      tags: [Nodes]
      summary: Report instance running
      description: Callback from node when an instance is running.
      security:
        - nodeToken: []
      responses:
        "200":
          description: Callback accepted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/nodes/{nodeId}/instances/{instanceId}/stopped:
    parameters:
      - $ref: "#/components/parameters/NodeId"
      - $ref: "#/components/parameters/NodeInstanceId"
    post:
      tags: [Nodes]
      summary: Report instance stopped
      description: Callback from node when an instance stops.
      security:
        - nodeToken: []
      responses:
        "200":
          description: Callback accepted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/nodes/{nodeId}/instances/{instanceId}/destroyed:
    parameters:
      - $ref: "#/components/parameters/NodeId"
      - $ref: "#/components/parameters/NodeInstanceId"
    post:
      tags: [Nodes]
      summary: Report instance destroyed
      description: Callback from node when an instance is destroyed.
      security:
        - nodeToken: []
      responses:
        "200":
          description: Callback accepted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/nodes/{nodeId}/instances/{instanceId}/failed:
    parameters:
      - $ref: "#/components/parameters/NodeId"
      - $ref: "#/components/parameters/NodeInstanceId"
    post:
      tags: [Nodes]
      summary: Report instance failed
      description: Callback from node when an instance reports failure.
      security:
        - nodeToken: []
      responses:
        "200":
          description: Callback accepted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/templates:
    get:
      tags: [Templates]
      summary: List templates
      description: Returns all templates.
      responses:
        "200":
          description: Templates ordered by creation time.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Templates]
      summary: Create template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplateRequest"
      responses:
        "201":
          description: Template created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/templates/{id}:
    parameters:
      - $ref: "#/components/parameters/TemplateId"
    get:
      tags: [Templates]
      summary: Get template
      responses:
        "200":
          description: Template found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/templates/{id}/versions:
    parameters:
      - $ref: "#/components/parameters/TemplateId"
    get:
      tags: [Template Versions]
      summary: List template versions
      description: Returns versions for the template, newest first.
      responses:
        "200":
          description: Template versions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemplateVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Template Versions]
      summary: Add template version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplateVersionRequest"
      responses:
        "201":
          description: Version created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    nodeToken:
      type: apiKey
      in: header
      name: X-Node-Token
      description: Shared token required for node callbacks and registration.
  parameters:
    InstanceId:
      name: id
      in: path
      required: true
      description: Instance identifier.
      schema:
        type: string
        format: uuid
    GroupId:
      name: groupId
      in: path
      required: true
      description: Instance group identifier.
      schema:
        type: string
        format: uuid
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      description: Template assignment identifier.
      schema:
        type: string
        format: uuid
    NodeId:
      name: nodeId
      in: path
      required: true
      description: Node identifier.
      schema:
        type: string
        format: uuid
    NodeInstanceId:
      name: instanceId
      in: path
      required: true
      description: Instance identifier.
      schema:
        type: string
        format: uuid
    TemplateId:
      name: id
      in: path
      required: true
      description: Template identifier.
      schema:
        type: string
        format: uuid
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: UP
        components:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/HealthComponent"
    HealthComponent:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: UP
        details:
          type: object
          additionalProperties: true
        components:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/HealthComponent"
    MetricsNamesResponse:
      type: object
      required: [names]
      properties:
        names:
          type: array
          items:
            type: string
    MetricResponse:
      type: object
      required: [name, measurements]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        baseUnit:
          type: string
          nullable: true
        measurements:
          type: array
          items:
            $ref: "#/components/schemas/MetricMeasurement"
        availableTags:
          type: array
          items:
            $ref: "#/components/schemas/MetricAvailableTag"
    MetricMeasurement:
      type: object
      required: [statistic, value]
      properties:
        statistic:
          type: string
        value:
          type: number
          format: double
    MetricAvailableTag:
      type: object
      required: [tag, values]
      properties:
        tag:
          type: string
        values:
          type: array
          items:
            type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresAt, roles]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresAt:
          type: string
          format: date-time
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
    Node:
      type: object
      required: [id, name, region, status, devMode, capacitySlots, usedSlots, lastHeartbeatAt, nodeVersion]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        region:
          type: string
        status:
          $ref: "#/components/schemas/NodeStatus"
        devMode:
          type: boolean
        capacitySlots:
          type: integer
          format: int32
        usedSlots:
          type: integer
          format: int32
        lastHeartbeatAt:
          type: string
          format: date-time
        nodeVersion:
          type: string
        tags:
          type: string
          nullable: true
        baseUrl:
          type: string
          format: uri
          nullable: true
    NodeRegistrationRequest:
      type: object
      required: [name, region, capacitySlots, nodeVersion]
      properties:
        name:
          type: string
        region:
          type: string
        capacitySlots:
          type: integer
          format: int32
          minimum: 1
        nodeVersion:
          type: string
        devMode:
          type: boolean
          default: false
        tags:
          type: string
          nullable: true
        baseUrl:
          type: string
          format: uri
          nullable: true
        status:
          $ref: "#/components/schemas/NodeStatus"
          description: Optional override; defaults to ONLINE.
    NodeHeartbeatRequest:
      type: object
      required: [status, usedSlots]
      properties:
        status:
          $ref: "#/components/schemas/NodeStatus"
        usedSlots:
          type: integer
          format: int32
          minimum: 0
    NodeRegistrationResponse:
      type: object
      required: [nodeId, heartbeatIntervalSeconds]
      properties:
        nodeId:
          type: string
          format: uuid
        heartbeatIntervalSeconds:
          type: integer
          format: int32
          description: Preferred heartbeat cadence communicated to the node.
    NodeStatus:
      type: string
      enum: [ONLINE, OFFLINE, UNKNOWN]
    Template:
      type: object
      required: [id, name, description, type, createdAt, createdBy]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        type:
          $ref: "#/components/schemas/TemplateType"
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          description: Username of the authenticated user who created the template.
    TemplateVersion:
      type: object
      required: [id, templateId, version, checksum, s3Key, createdAt]
      properties:
        id:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
        version:
          type: string
        checksum:
          type: string
        s3Key:
          type: string
        metadataJson:
          type: string
          nullable: true
          description: Optional metadata blob persisted with the version.
        createdAt:
          type: string
          format: date-time
    CreateTemplateRequest:
      type: object
      description: Template creator is derived from the authenticated user.
      required: [name, description, type]
      properties:
        name:
          type: string
        description:
          type: string
        type:
          $ref: "#/components/schemas/TemplateType"
    CreateTemplateVersionRequest:
      type: object
      required: [version, checksum, s3Key]
      properties:
        version:
          type: string
        checksum:
          type: string
          description: Hash of the uploaded object (client-supplied).
        s3Key:
          type: string
          description: S3 key where the template tarball is stored.
        metadataJson:
          type: string
          nullable: true
          description: Optional metadata stored with the version.
    TemplateType:
      type: string
      enum: [CUSTOM]
    Role:
      type: string
      enum: [ADMIN, OPERATOR, VIEWER]
    InstanceGroup:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateInstanceGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
    Instance:
      type: object
      required:
        [id, name, displayName, state, createdAt, updatedAt, templateLayers]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        displayName:
          type: string
        state:
          $ref: "#/components/schemas/InstanceState"
        nodeId:
          type: string
          format: uuid
          nullable: true
        requestedBy:
          type: string
          format: uuid
          nullable: true
        region:
          type: string
          nullable: true
          description: Optional node preference for scheduling.
        tags:
          type: string
          nullable: true
          description: Optional node preference; comma-separated tags.
        devModeAllowed:
          type: boolean
          nullable: true
          description: Optional node preference; when false, dev-mode nodes are excluded.
        portsJson:
          type: string
          nullable: true
        variablesJson:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        stoppedAt:
          type: string
          format: date-time
          nullable: true
        failureReason:
          type: string
          nullable: true
        templateLayers:
          type: array
          items:
            $ref: "#/components/schemas/InstanceTemplateLayer"
    InstanceTemplateLayer:
      type: object
      required: [id, templateId, templateVersionId, priority, orderIndex, source]
      properties:
        id:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
        templateVersionId:
          type: string
          format: uuid
        priority:
          type: integer
          format: int32
          minimum: 0
        orderIndex:
          type: integer
          format: int32
          minimum: 0
        source:
          $ref: "#/components/schemas/TemplateAssignmentSource"
    CreateInstanceRequest:
      type: object
      required: [name, displayName, templateLayers]
      properties:
        name:
          type: string
        displayName:
          type: string
        requestedBy:
          type: string
          format: uuid
          nullable: true
        nodeId:
          type: string
          format: uuid
          nullable: true
        region:
          type: string
          nullable: true
        tags:
          type: string
          nullable: true
          description: Optional node preference; comma-separated tags.
        devModeAllowed:
          type: boolean
          nullable: true
        templateLayers:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TemplateAssignmentRequest"
        variables:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: Variables map serialized into `variablesJson`. Mutually exclusive with `variablesJson`.
        variablesJson:
          type: string
          nullable: true
          description: Raw JSON string persisted verbatim. Mutually exclusive with `variables`.
        portsJson:
          type: string
          nullable: true
      not:
        required: [variables, variablesJson]
    TemplateAssignmentRequest:
      type: object
      description: `templateId` is required. `templateVersionId` pins an exact version; omit it to use latest at resolve time.
      required: [templateId]
      properties:
        templateId:
          type: string
          format: uuid
          description: Reference a template; latest version is used when no version id is provided.
        templateVersionId:
          type: string
          format: uuid
          description: Reference a specific template version.
        priority:
          type: integer
          format: int32
          minimum: 0
          description: Optional priority; defaults to list order position when omitted for `POST /api/instances`, and defaults to 0 for assignment endpoints.
    TemplateAssignment:
      type: object
      required: [id, templateId, priority]
      properties:
        id:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
        templateVersionId:
          type: string
          format: uuid
          nullable: true
        priority:
          type: integer
          format: int32
          minimum: 0
    TemplateAssignmentSource:
      type: string
      enum: [INSTANCE, GROUP]
    InstanceState:
      type: string
      enum:
        [REQUESTED, PREPARING, PREPARED, STARTING, RUNNING, STOPPING, STOPPED, DESTROYED, FAILED]
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
      required: [status, error, message]
  responses:
    BadRequest:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required or invalid credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated but not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with the current state (for example, the resource already exists or no eligible nodes are available).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadGateway:
      description: Upstream node command failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
