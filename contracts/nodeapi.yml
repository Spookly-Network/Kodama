title: Kodama Brain ↔ Node Agent API
version: "0.1.0"
description: Internal HTTP contract between the Brain and node agents. Not part of the public OpenAPI surface.

auth:
  commandEndpoints:
    description: Command endpoints require Brain authentication via token header or client certificate.
    token:
      headerName: X-Node-Token
      source: node-agent.auth.token-path
    mTls:
      certificatePath: node-agent.auth.cert-path

endpoints:
  health:
    method: GET
    path: /health
    summary: Node agent health
    response:
      status: ok
      nodeId: uuid|null
      nodeName: string|null
      nodeVersion: string|null

  devMode:
    get:
      method: GET
      path: /api/node/dev-mode
      summary: Get dev-mode status
      response:
        devMode: boolean
        previousDevMode: boolean
        changed: boolean
    post:
      method: POST
      path: /api/node/dev-mode
      summary: Update dev-mode
      request:
        devMode: boolean
      response:
        devMode: boolean
        previousDevMode: boolean
        changed: boolean

  templateCachePurge:
    method: POST
    path: /api/cache/purge
    summary: Purge template cache
    request:
      templateId: string|optional
    response:
      scope: all|template
      templateId: string|null
      deletedFiles: int64
      deletedDirectories: int64
      deletedBytes: int64

  instancePrepare:
    method: POST
    path: /api/instances/{instanceId}/prepare
    summary: Prepare instance workspace
    request:
      instanceId: uuid
      name: string|null
      displayName: string|null
      containerImage: string|null
      installScript: string|null
      startCommand: list<string>|null
      slotsRequired: int32|null
      portsJson: string|null (legacy override; preferred runtime value is allocated by node from portDefinitions)
      portDefinitions: list|null
        - name: string
          protocol: tcp|udp
          containerPort: int32
          hostRange:
            min: int32
            max: int32
            step: int32
      variables: map<string,string>|null
      variablesJson: string|null
      layers:
        - templateVersionId: uuid
          templateId: uuid
          version: string
          checksum: string
          s3Key: string
          metadataJson: string|null
          orderIndex: int32
    example:
      instanceId: "04a46594-c578-462c-b2ec-fbbec84cd148"
      name: "lobby-eu-1"
      displayName: "Lobby EU #1"
      containerImage: "ghcr.io/spookly-network/hytale:latest"
      installScript: "./install.sh"
      startCommand: ["./run-server.sh", "--port", "${PORT}"]
      slotsRequired: 2
      portDefinitions:
        - name: "game"
          protocol: "udp"
          containerPort: 7777
          hostRange:
            min: 14000
            max: 14100
            step: 1
      variables:
        SERVER_NAME: "Lobby EU #1"
      layers:
        - templateVersionId: "f46e4888-f9f7-4e10-a7e8-393f3166ac9f"
          templateId: "1474e8eb-7391-4231-af03-48e451f6fcd8"
          version: "v1.0.2"
          checksum: "sha256:8ca2806adff16442984f4f7c35cfaf5f5a10967f65e6b4f3e52f31f39a2f4f16"
          s3Key: "templates/hytale/base/v1.0.2.tar.gz"
          metadataJson: null
          orderIndex: 0
    responses:
      "200": OK
      "400": Bad Request

  instanceStart:
    method: POST
    path: /api/instances/{instanceId}/start
    summary: Start instance
    request:
      instanceId: uuid
      name: string|null
    responses:
      "200": OK
      "400": Bad Request

  instanceStop:
    method: POST
    path: /api/instances/{instanceId}/stop
    summary: Stop instance
    request:
      instanceId: uuid
      name: string|null
    responses:
      "200": OK
      "400": Bad Request

  instanceDestroy:
    method: POST
    path: /api/instances/{instanceId}/destroy
    summary: Destroy instance
    request:
      instanceId: uuid
      name: string|null
    responses:
      "200": OK
      "400": Bad Request

  instanceRegistryList:
    method: GET
    path: /api/instances/registry
    summary: List local instance registry entries
    response:
      instances:
        - instanceId: uuid
          name: string|null
          displayName: string|null
          containerImage: string|null
          installScript: string|null
          startCommand: list<string>
          slotsRequired: int32
          portsJson: string|null
          installCompleted: boolean
          variables: map<string,string>|null (redacted in registry listing)
          layers:
            - templateVersionId: uuid
              templateId: uuid
              version: string
              checksum: string
              s3Key: string
              metadataJson: string|null
              orderIndex: int32
          preparedAt: datetime|null
          containerId: string|null
          containerStatus: string|null
          containerStatusUpdatedAt: datetime|null
          containerExitCode: int32|null
          containerExitReason: string|null
          workspacePath: string|null (relative to node-agent.workspace-dir)

callbacks:
  prepared:
    method: POST
    path: /api/nodes/{nodeId}/instances/{instanceId}/prepared
    request: optional
      portsJson: string|null (serialized JSON array of allocated ports: [{name, protocol, containerPort, hostPort}])
    example:
      portsJson: '[{"name":"game","protocol":"udp","containerPort":7777,"hostPort":14000}]'
  running:
    method: POST
    path: /api/nodes/{nodeId}/instances/{instanceId}/running
  stopped:
    method: POST
    path: /api/nodes/{nodeId}/instances/{instanceId}/stopped
  destroyed:
    method: POST
    path: /api/nodes/{nodeId}/instances/{instanceId}/destroyed
  failed:
    method: POST
    path: /api/nodes/{nodeId}/instances/{instanceId}/failed

notes:
  - Dev-mode updates are in-memory only; restart resets to configured defaults.
  - Start now creates and starts a Docker container for the prepared workspace and records the container id locally.
  - Stop now resolves the container id from the local registry, stops the container, and updates the registry state to stopped.
  - The node agent records container exit codes and reasons in the local registry when containers stop.
  - `GET /api/instances/registry` returns registry entries derived from instance workspaces on disk.
  - Registry listings omit variables and return workspacePath relative to `node-agent.workspace-dir`.
  - Node prepare allocates host ports from `portDefinitions[*].hostRange` and persists reservations in registry `portsJson`.
  - Prepared callbacks may include `portsJson` as a JSON array containing `name`, `protocol`, `containerPort`, and `hostPort`.
  - `node-agent.instance-runtime.stop-timeout-seconds` controls the graceful stop timeout before force-kill (unset uses Docker defaults).
  - Validation errors return 400 and stop command processing.
